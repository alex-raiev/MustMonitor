name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y qt6-base-dev qt6-declarative-dev libmodbus-dev cmake build-essential libgl1-mesa-dev
      
      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build . -j$(nproc)
      
      - name: Package
        run: |
          mkdir -p MustMonitor-linux
          cp build/MustMonitor/MustMonitor MustMonitor-linux/
          cp config.json MustMonitor-linux/
          cp README.md MustMonitor-linux/
          tar -czf MustMonitor-linux-x64.tar.gz MustMonitor-linux
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MustMonitor-linux-x64
          path: MustMonitor-linux-x64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install qt6 libmodbus cmake
      
      - name: Build
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_PREFIX_PATH=$(brew --prefix qt6) ..
          cmake --build . -j$(sysctl -n hw.ncpu)
      
      - name: Package
        run: |
          mkdir -p MustMonitor-macos
          cp build/MustMonitor/MustMonitor MustMonitor-macos/
          cp config.json MustMonitor-macos/
          cp README.md MustMonitor-macos/
          tar -czf MustMonitor-macos-x64.tar.gz MustMonitor-macos
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MustMonitor-macos-x64
          path: MustMonitor-macos-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          arch: 'win64_msvc2019_64'
      
      - name: Install vcpkg dependencies
        run: |
          vcpkg install libmodbus:x64-windows
      
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build . --config Release
      
      - name: Package
        run: |
          mkdir MustMonitor-windows
          copy build\MustMonitor\Release\MustMonitor.exe MustMonitor-windows\
          copy config.json MustMonitor-windows\
          copy README.md MustMonitor-windows\
          windeployqt MustMonitor-windows\MustMonitor.exe
          Compress-Archive -Path MustMonitor-windows -DestinationPath MustMonitor-windows-x64.zip
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MustMonitor-windows-x64
          path: MustMonitor-windows-x64.zip

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            MustMonitor-linux-x64/MustMonitor-linux-x64.tar.gz
            MustMonitor-macos-x64/MustMonitor-macos-x64.tar.gz
            MustMonitor-windows-x64/MustMonitor-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
